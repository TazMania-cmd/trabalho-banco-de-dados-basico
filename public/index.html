<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locadora - Banco de Dados I</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div>
      <p class="disciplina">Banco de Dados I + Linguagem de Programacao II</p>
      <h1>Consulta da Locadora</h1>
    </div>
    <span id="status" class="status">Verificando conexao...</span>
  </header>

  <main class="layout">
    <section class="painel-controles" aria-label="Consultas disponiveis">
      <button data-rota="/api/clientes">Clientes</button>
      <button data-rota="/api/categorias">Categorias</button>
      <button data-rota="/api/filmes">Filmes com categorias</button>
      <button data-rota="/api/locacoes">Locacoes</button>
      <button data-rota="/api/locacoes/detalhes">Locacoes detalhadas</button>

      <form id="form-cliente" class="busca-cliente">
        <label for="cliente-id">Locacoes por cliente</label>
        <div>
          <input id="cliente-id" name="clienteId" type="number" min="1" value="1" required>
          <button type="submit">Buscar</button>
        </div>
      </form>
    </section>

    <section class="resultado">
      <div class="resultado-topo">
        <h2 id="titulo">Resultado</h2>
        <span id="contador">0 registros</span>
      </div>
      <div id="mensagem" class="mensagem">Escolha uma consulta para recuperar dados ja salvos no banco.</div>
      <div class="tabela-area">
        <table id="tabela"></table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
